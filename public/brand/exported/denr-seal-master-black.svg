<!--
  DENR Official Seal — Master SVG (Evolutionary Refresh)
  Department of Environment and Natural Resources
  Republic of the Philippines

  This is a geometrically constructed interpretation for digital use.
  For official documents, use the government-issued seal assets.

  All text converted to paths for production readiness.
  Two-colour: Forest (#1B5E20) + Gold (#D9A441)
-->
